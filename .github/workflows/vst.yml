name: Build VST3

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "plugin/**"
      - "src/dsp/**"
      - ".github/workflows/vst.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "plugin/**"
      - "src/dsp/**"
      - ".github/workflows/vst.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vst3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: build/vst
  JUCE_VERSION: 7.0.12
  PLUGINVAL_VERSION: 1.0.4
  VST3_DIR: build/vst/plugin/juce/Pico2VibePlugin_artefacts/Release/VST3

jobs:
  build-vst3-windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout pico2vibe
        uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: JUCE

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B $env:BUILD_DIR -G "Visual Studio 17 2022" -A x64
          -DPICO2VIBE_BUILD_FIRMWARE=OFF
          -DPICO2VIBE_BUILD_JUCE_PLUGIN=ON
          -DBUILD_TESTING=ON
          -DPICO2VIBE_JUCE_DIR="$env:GITHUB_WORKSPACE/JUCE"

      - name: Build VST3
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config Release --parallel

      - name: Run VST smoke tests
        shell: pwsh
        run: ctest --test-dir $env:BUILD_DIR -C Release --output-on-failure

      - name: Verify bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "$env:VST3_DIR/pico2vibe.vst3"
          $binary = Join-Path $bundle "Contents/x86_64-win/pico2vibe.vst3"

          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "VST3 binary not found: $binary"
          }

          Get-ChildItem -LiteralPath $bundle -Recurse | Select-Object FullName, Length

      - name: Download pluginval
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "pluginval_Windows.zip"
          $toolsDir = Join-Path $env:RUNNER_TEMP "pluginval"
          $url = "https://github.com/Tracktion/pluginval/releases/download/v$env:PLUGINVAL_VERSION/pluginval_Windows.zip"
          $expectedSha256 = "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "pluginval checksum mismatch: $actualSha256"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $toolsDir
          $executable = Get-ChildItem -LiteralPath $toolsDir -Filter pluginval.exe -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $executable) {
            throw "pluginval.exe was not found in the downloaded archive"
          }
          "PLUGINVAL_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "$env:VST3_DIR/pico2vibe.vst3"
          $logDir = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR/pluginval"
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null

          & $env:PLUGINVAL_EXE --validate-in-process --validate $bundle `
            --strictness-level 8 --timeout-ms 120000 --skip-gui-tests `
            --random-seed 0x7f78bbf `
            --output-dir $logDir --output-filename pluginval.log

          $log = Join-Path $logDir "pluginval.log"
          Get-Content -LiteralPath $log
          if ($LASTEXITCODE -ne 0 -or -not (Select-String -LiteralPath $log -Pattern '^SUCCESS$' -Quiet)) {
            throw "pluginval validation failed"
          }

      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pico2vibe-pluginval-windows-x64
          path: ${{ env.BUILD_DIR }}/pluginval/pluginval.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico2vibe-vst3-windows-x64
          path: ${{ env.VST3_DIR }}/pico2vibe.vst3
          if-no-files-found: error
          retention-days: 14
